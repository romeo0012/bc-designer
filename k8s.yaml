      "Částky jsou přepočtené z Kč. Kurz {src} k {date}: 1 EUR = {eur} Kč, 1 USD = {usd} Kč.": "Amounts are converted from CZK. {src} exchange rate as of {date}: 1 EUR = {eur} CZK, 1 USD = {usd} CZK.",
      "Ceny jsou v {m} za měsíc za všechny VM v řádku (počet × cena VM). Cena IaaS = CPU + RAM + disk podle sazeb a délky závazku. 1 cloudlet = 128 MiB RAM + 400 MHz CPU. Cloudlety = potřeba VM × větší z hodnot Rezervace a Utilizace (rezervované se platí vždy, dynamické do výše utilizace). Cena PaaS je cena cloudletů v objemových pásmech, bez disku, IP a provozu. Řádky jsou zaokrouhlené. Ceník je převzatý z referenční aplikace v Kč (stav k 16. 10. 2026).":
        "Prices are in {m} per month for all VMs in the row (count × VM price). IaaS price = CPU + RAM + disk according to the rates and the commitment term. 1 cloudlet = 128 MiB RAM + 400 MHz CPU. Cloudlets = VM demand × the greater of Reservation and Utilization (reserved cloudlets are always paid, dynamic ones up to the utilization). PaaS price is the price of cloudlets in volume bands, excluding disk, IP and traffic. Rows are rounded. The price list is taken from the reference application in CZK (as of 16 Oct 2026).",
