          const dur = d.t1 ? Math.round((new Date(d.t1) - new Date(d.t0)) / 1000) + " s" : "–";
          if (d.kind === "vm") {
            det.append(kv([[T("Use-case"), T(d.ucName)], [T("Začátek"), docDt(d.t0)], [T("Konec"), docDt(d.t1)], [T("Trvání"), dur], [T("Předpona názvu VM"), d.cfg.prefix], [T("Image z knihovny"), d.cfg.image], ["VLAN", d.cfg.vlans ? Object.entries(d.cfg.vlans).map(([g, n]) => T(g) + ": " + (n || T("Bez VLAN"))).join("; ") : d.cfg.vlan], [T("SSH klíč (volitelně)"), d.cfg.key], [T("Spustit VM po vytvoření"), T(d.cfg.start ? "ano" : "ne")], [T("Souběžně nasazovaných VM"), d.cfg.concurrency], [T("Simulovat chybu API u jedné VM (klon disku)"), T(d.cfg.failure ? "ano" : "ne")]]),
              tbl(["VM", T("Role"), "vCPU", "CPU MHz", "RAM MiB", "Disk GiB", T("Třída"), T("Stav"), "UUID VM"], d.vms.map((v) => [v.name, trRole(v.role), v.smp, v.cpu_mhz, v.mem_mib, v.disk_gib, v.tier, T(SIM_ST[v.status] || v.status) + (v.error ? " – " + v.error : ""), v.uuid])), logBlock(T("Volání API"), d));
          } else {
            det.append(kv([[T("Use-case"), T(d.ucName)], [T("Začátek"), docDt(d.t0)], [T("Konec"), docDt(d.t1)], [T("Trvání"), dur], [T("Verze Kubernetes"), d.cfg.version], [T("Pod CIDR"), d.cfg.podCidr], ["Calico", d.cfg.calico], ["API server", d.cfg.api], [T("Souběžně instalovaných uzlů"), d.cfg.concurrency], ["Grafana", T(d.cfg.grafana ? "ano" : "ne")], ["Hello World", T(d.cfg.hello ? "ano" : "ne")], [T("Simulovat chybu"), d.cfg.failure || T("ne")]]),
              tbl([T("Uzel"), T("Role"), "IP", "CPU GHz", "RAM GiB", "Disk GiB", T("Stav")], d.vms.map((v) => [v.name, v.role, v.ip, fmt(v.cpu_ghz), fmt(v.mem_gib), v.disk_gib, T(K8S_ST[v.status] || v.status) + (v.error ? " – " + v.error : "")])));
            if (d.result && d.result.failed) det.appendChild(mkEl("p", "dp-err", "⚠ " + d.result.failed.name + ": " + d.result.failed.message));
            if (d.result && d.result.addons && d.result.addons.length) det.appendChild(mkEl("pre", "dp-out", d.result.addons.map((a) => a.id + ": " + a.note).join("\n")));
            det.appendChild(logBlock(T("Příkazy"), d));
          }
          list.appendChild(det);
        });
      }
      kind.addEventListener("change", draw); oc.addEventListener("change", draw); draw(); el.appendChild(box);
    }

    function renderAll() {
      $("m-biz").classList.toggle("on", state.mode === "biz");
      $("m-arch").classList.toggle("on", state.mode === "arch");
      $("m-deploy").classList.toggle("on", state.mode === "deploy");
      $("m-k8s").classList.toggle("on", state.mode === "k8s");
      $("m-heal").classList.toggle("on", state.mode === "heal");
      $("m-docs").classList.toggle("on", state.mode === "docs");
      const dep = isSimMode();
      document.querySelector("aside.req").hidden = dep || state.mode === "docs";
      if (dep || state.mode === "docs") reqOpen(false);
      $("ops").hidden = state.mode !== "heal"; if (state.mode !== "heal") opsOpen(false);
      renderTiles(); renderCompare(); renderDetail(); renderReq();
      dpbShow(dep);
    }

    $("m-biz").addEventListener("click", () => { state.mode = "biz"; lsSet("usecase-state", state); renderAll(); });
    $("m-arch").addEventListener("click", () => { state.mode = "arch"; lsSet("usecase-state", state); renderAll(); });
    $("m-deploy").addEventListener("click", () => { state.mode = "deploy"; lsSet("usecase-state", state); renderAll(); });
    $("m-k8s").addEventListener("click", () => { state.mode = "k8s"; lsSet("usecase-state", state); renderAll(); });
    $("ops-fab").addEventListener("click", () => opsOpen($("ops-panel").hidden));
    $("ops-close").addEventListener("click", () => opsOpen(false));
    $("ops-form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("ops-in").value.trim(); if (!v) return; $("ops-in").value = ""; opsPush(v, "me"); opsHandle(v).catch(() => {}); });
    ["Oprav aplikaci", "Oprav všechno", "Jaký je stav clusteru?", "Co se stalo?"].forEach((x) => { const b = mkEl("button", "", T(x)); b.type = "button"; b.dataset.q = x; b.addEventListener("click", () => { opsPush(T(x), "me"); opsHandle(T(x)).catch(() => {}); }); $("ops-ex").appendChild(b); });
    $("m-docs").addEventListener("click", () => { state.mode = "docs"; lsSet("usecase-state", state); renderAll(); });
    $("m-heal").addEventListener("click", () => { state.mode = "heal"; lsSet("usecase-state", state); renderAll(); });

    $("lang").addEventListener("click", () => setLang(LANG === "cs" ? "en" : "cs"));

    // --- Business požadavky: pravidlový přepočet sizingu (viz sizing.js) ---
    const reqKey = (id) => "usecase-req-" + id;
    const REQ_EXAMPLES = [
      "Intranet pro 500 zaměstnanců, běžná dostupnost, 200 GB dat",
      "20 000 uživatelů, dostupnost 99,9 %, 2 TB dat, růst 30 % ročně, sezónní špičky 3×",
      "Pilotní provoz pro 100 uživatelů, bez vysoké dostupnosti"
    ];
    function reqOpen(open) {
      $("req-panel").hidden = !open;
      $("req-fab").setAttribute("aria-expanded", String(open));
      if (open) $("req-text").focus();
    }
    function foundList(found) {
      const ul = document.createElement("ul"); found.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); }); return ul;
    }
    function renderReqOut(s, msg) {
      const out = $("req-out"); out.innerHTML = "";
      if (msg) { const p = document.createElement("p"); p.className = "req-msg"; p.textContent = msg; out.appendChild(p); }
      if (!s) return;
      const h = document.createElement("b"); h.textContent = T("Rozpoznáno v zadání"); out.appendChild(h);
      out.appendChild(foundList(SZ.parse(s.text).found));          // popisky se skládají v aktuálním jazyce
      const r = document.createElement("p"); r.className = "note";
      r.textContent = T("Zátěž ≈ {u} uživatelů (×{f} oproti výchozímu sizingu). VM: {vb} → {va}, CPU: {gb} → {ga} GHz, RAM: {rb} → {ra} GiB, disk: {db} → {da}.",
        { u: fmt(s.users), f: fmt(s.f), vb: s.before.vm, va: s.after.vm, gb: fmt(s.before.ghz), ga: fmt(s.after.ghz), rb: fmt(s.before.ram), ra: fmt(s.after.ram), db: fmtGb(s.before.disk), da: fmtGb(s.after.disk) });
      out.appendChild(r);
    }
    function renderReqDefault(u) {
      const out = $("req-out"); out.innerHTML = "";
      if (!u.brief) return;
      const m = document.createElement("p"); m.className = "req-msg"; m.textContent = T("Výchozí sizing odpovídá tomuto zadání. Upravte text a přepočítejte."); out.appendChild(m);
      const h = document.createElement("b"); h.textContent = T("Rozpoznáno v zadání"); out.appendChild(h);
      out.appendChild(foundList(SZ.parse(u.brief).found));
    }
    function renderReq() {
      if (typeof SZ === "undefined") { $("req-fab").disabled = true; $("req-fab").title = T("Výpočet se nepodařilo načíst"); return; }
      const u = UC.find(x => x.id === state.id), s = lsGet(reqKey(u.id));
      $("req-uc").textContent = T(u.name);
      $("req-text").value = s && s.text ? s.text : T(u.brief || "");   // bez vlastního zadání se předvyplní předpokládané
      if (s) renderReqOut(s); else renderReqDefault(u);
    }
    function applyReq() {
      const u = UC.find(x => x.id === state.id), text = $("req-text").value.trim();
      if (!text) { renderReqOut(lsGet(reqKey(u.id)), T("Napište požadavky, např. počet uživatelů, dostupnost nebo objem dat.")); return; }
      // totéž co předpokládané zadání (česky nebo anglicky) = výchozí hodnoty
      if (text === (u.brief || "").trim() || text === T(u.brief || "").trim()) { clearReq(); return; }
      const p = SZ.parse(text);
      if (!p.found.length) { renderReqOut(null, T("V zadání jsem nenašel nic, z čeho jde sizing spočítat. Uveďte např. počet uživatelů, požadavky za sekundu, objem dat, dostupnost, růst nebo špičky.")); return; }
      const res = SZ.adjust(factory(u), p, SZ.parse(u.brief || ""));
      const keepNet = new Map(rowsOf(u.id).filter((r) => r.vlan).map((r) => [r.name + "|" + r.role, r.vlan]));   // zvolené VLAN přepočet nemění
      res.rows.forEach((r) => { const v = keepNet.get(r.name + "|" + r.role); if (v) r.vlan = v; });
      rows[u.id] = res.rows; lsSet("usecase-v1-" + u.id, res.rows);
      lsSet(reqKey(u.id), { text, f: res.f, users: res.users, before: res.before, after: res.after });
      renderAll();
    }
    function clearReq() {
      const u = UC.find(x => x.id === state.id);
      try { localStorage.removeItem(reqKey(u.id)); localStorage.removeItem("usecase-v1-" + u.id); } catch (e) {}
      delete rows[u.id]; renderAll();
    }
    function renderExamples() {
      const box = $("req-ex"); box.innerHTML = "";
      REQ_EXAMPLES.forEach(cs => { const t = T(cs), b = document.createElement("button"); b.type = "button"; b.textContent = t; b.addEventListener("click", () => { $("req-text").value = t; $("req-text").focus(); }); box.appendChild(b); });
    }
    $("req-fab").addEventListener("click", () => reqOpen($("req-panel").hidden));
    $("req-close").addEventListener("click", () => reqOpen(false));
    $("req-go").addEventListener("click", applyReq);
    $("req-clear").addEventListener("click", clearReq);
    $("req-text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); applyReq(); } });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("req-panel").hidden) reqOpen(false); });

    const saved = lsGet("usecase-state");
    if (saved && UC.some(u => u.id === saved.id) && (saved.mode === "biz" || saved.mode === "arch" || saved.mode === "deploy" || saved.mode === "k8s" || saved.mode === "heal" || saved.mode === "docs")) state = saved;
    if (typeof SZ !== "undefined") SZ.setLang(LANG);
    applyStatic(); renderExamples(); renderAll();
    </script>
    </body>
