  cloudsim.js: |
    // Simulovaný cloud: v prohlížeči se chová jako CloudSigma API 2.0 podle aplikace cloudsigma-interactive
    // (stejné cesty, kódy odpovědí a tvary payloadů). Nic se nikam neposílá a nevytváří; slouží k simulaci nasazení.
    const SimCloud = (() => {
      const GIB = 1073741824;
      // základní doba odpovědi jednotlivých volání v ms (simulovaná "reálná"; skutečné čekání se dělí rychlostí simulace)
      const BASE_MS = { list: 160, create: 420, clone: 520, poll: 180, put: 380, attach: 460, get: 200, start: 350 };

      function mulberry32(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      function create(options) {
        const opt = Object.assign({ seed: 7, speed: 4, sleep: (ms) => new Promise((r) => setTimeout(r, ms)) }, options);
        const rng = mulberry32(opt.seed);
        const hex = (n) => Array.from({ length: n }, () => Math.floor(rng() * 16).toString(16)).join("");
        const uid = () => hex(8) + "-" + hex(4) + "-4" + hex(3) + "-a" + hex(3) + "-" + hex(12);
        let S;
        const fresh = () => ({
          servers: {}, drives: {},
          library: [["Ubuntu 22.04 LTS", 10], ["Ubuntu 24.04 LTS", 10], ["Debian 12", 8], ["Rocky Linux 9", 10], ["AlmaLinux 9", 10]]
            .map(([name, gib]) => ({ uuid: uid(), name, size: gib * GIB, media: "disk", image_type: "preinst", deprecated: false })),
          vlans: [["DMZ", ""], ["K8S", ""], ["OPS", ""], ["CICD", ""]].map(([name]) => ({ uuid: uid(), name })),
          keys: [{ uuid: uid(), name: "deploy-key" }, { uuid: uid(), name: "admin-key" }]
        });
        S = fresh();

        const strip = (d) => { const o = Object.assign({}, d); delete o._polls; delete o._need; return o; };
        const err = (status, type, message, point) => ({ status, ok: false, json: [{ error_type: type, error_point: point || null, error_message: message }] });
        const done = (status, json) => ({ status, ok: status < 400, json });
        const page = (items, params) => { const off = +((params || {}).offset || 0), lim = +((params || {}).limit || 100); return { meta: { total_count: items.length, offset: off, limit: lim }, objects: items.slice(off, off + lim) }; };

        // volání rozpoznané podle cesty (pro dobu odezvy a vložení chyby)
        function classify(method, p, params) {
          if (method === "GET" && /^(libdrives|vlans|pubkeys|servers)$/.test(p[0]) && p.length === 1) return ["list", "list"];
          if (method === "POST" && p[0] === "servers" && p.length === 1) return ["create", "create"];
          if (method === "POST" && p[0] === "libdrives" && p[2] === "action" && params && params.do === "clone") return ["clone", "clone"];
          if (method === "GET" && p[0] === "drives") return ["wait", "poll"];
          if (method === "PUT" && p[0] === "drives") return ["resize", "put"];
          if (method === "PUT" && p[0] === "servers") return ["attach", "attach"];
          if (method === "GET" && p[0] === "servers") return ["verify", "get"];
          if (method === "POST" && p[0] === "servers" && p[2] === "action" && params && params.do === "start") return ["start", "start"];
          return ["other", "get"];
        }

        function handle(method, p, body, params) {
          const res = p[0];
          if (method === "GET" && p.length === 1) {
            if (res === "libdrives") return done(200, page(S.library, params));
            if (res === "vlans") return done(200, page(S.vlans, params));
            if (res === "pubkeys") return done(200, page(S.keys, params));
            if (res === "servers") return done(200, page(Object.values(S.servers).map((s) => ({ uuid: s.uuid, name: s.name, status: s.status })), params));
          }
          if (method === "POST" && res === "servers" && p.length === 1) {
            const spec = body && body.objects && body.objects[0];
            if (!spec || !spec.name) return err(400, "validation", "name is required", "name");
            if (Object.values(S.servers).some((s) => s.name === spec.name)) return err(400, "validation", "server with this name already exists", "name");
            for (const k of ["cpu", "mem", "smp"]) if (!Number.isInteger(spec[k]) || spec[k] <= 0) return err(400, "validation", k + " must be a positive integer", k);
            if (!spec.vnc_password) return err(400, "validation", "vnc_password is required", "vnc_password");
            const s = Object.assign({}, spec, { uuid: uid(), status: "stopped", drives: [], nics: [], pubkeys: [], _starts: 0 });
            S.servers[s.uuid] = s; return done(201, { objects: [strip(s)] });
          }
          if (method === "POST" && res === "libdrives" && p[2] === "action" && params && params.do === "clone") {
            const img = S.library.find((i) => i.uuid === p[1]);
            if (!img) return err(404, "notexist", "library drive does not exist", "uuid");
            if (!body || !body.name) return err(400, "validation", "name is required", "name");
            const d = { uuid: uid(), name: body.name, size: img.size, media: "disk", storage_type: "nvme", status: "cloning_dst", mounted_on: [], _polls: 0, _need: 3 + Math.floor(rng() * 3) };
            S.drives[d.uuid] = d; return done(202, { objects: [{ uuid: d.uuid, name: d.name, status: d.status }] });
          }
          if (res === "drives" && p[1]) {
            const d = S.drives[p[1]]; if (!d) return err(404, "notexist", "drive does not exist", "uuid");
            if (method === "GET") { if (d.status === "cloning_dst" && ++d._polls >= d._need) d.status = "unmounted"; return done(200, strip(d)); }
            if (method === "PUT") {
              if (d.status !== "unmounted" || d.mounted_on.length) return err(400, "validation", "drive must be unmounted", "status");
              if (!body || !Number.isInteger(body.size) || body.size < d.size) return err(400, "validation", "size can only be increased", "size");
              d.size = body.size; return done(200, { objects: [strip(d)] });
            }
          }
          if (res === "servers" && p[1]) {
            const s = S.servers[p[1]]; if (!s) return err(404, "notexist", "server does not exist", "uuid");
            if (method === "GET") { if (s.status === "starting" && ++s._starts >= 2) s.status = "running"; return done(200, strip(s)); }
            if (method === "PUT" && p.length === 2) {
              if (s.status !== "stopped") return err(400, "validation", "server must be stopped", "status");
              for (const k of ["name", "cpu", "mem", "smp", "vnc_password"]) if (body[k] === undefined || body[k] === "") return err(400, "validation", k + " is required", k);
              const ds = body.drives || [];
              for (const d of ds) { const dr = S.drives[d.drive]; if (!dr) return err(404, "notexist", "drive does not exist", "drives"); if (dr.status !== "unmounted" || dr.mounted_on.length) return err(400, "validation", "drive is not available", "drives"); }
              s.drives.forEach((d) => { const dr = S.drives[d.drive]; if (dr) { dr.mounted_on = []; dr.status = "unmounted"; } });
              ds.forEach((d) => { const dr = S.drives[d.drive]; dr.mounted_on = [{ uuid: s.uuid }]; dr.status = "mounted"; });
              Object.assign(s, { drives: ds, nics: body.nics || [], pubkeys: body.pubkeys || [] }); return done(200, { objects: [strip(s)] });
            }
            if (method === "POST" && p[2] === "action" && params && params.do === "start") {
              if (s.status !== "stopped") return err(400, "validation", "server is not stopped", "status");
              if (!s.drives.length) return err(400, "validation", "server has no boot drive", "drives");
              s.status = "starting"; s._starts = 0; return done(202, { objects: [{ uuid: s.uuid, action: "start", result: "success" }] });
            }
          }
          return err(404, "notexist", "unknown resource " + method + " " + p.join("/"), null);
        }

        const api = {
          get speed() { return opt.speed; }, set speed(v) { opt.speed = Math.max(0.1, +v || 1); },
          failOn: null,                       // { vm: název VM, step: krok } - jednorázová simulovaná chyba tenantu
          sleep: (ms) => opt.sleep(ms / opt.speed),
          reset() { S = fresh(); api.failOn = null; },
          restore(snap) { S = JSON.parse(JSON.stringify(snap)); api.failOn = null; fresh().vlans.forEach((v) => { if (!(S.vlans || (S.vlans = [])).some((x) => x.name === v.name)) S.vlans.push(v); }); },   // obnova uloženého stavu simulovaného cloudu
          snapshot() { return JSON.parse(JSON.stringify(S)); },
          async request(method, path, o) {
            o = o || {}; const p = String(path).replace(/^\/+|\/+$/g, "").split("/"), [step, speedClass] = classify(method, p, o.params);
            const ms = Math.round(BASE_MS[speedClass] * (0.6 + rng() * 0.8));
            await opt.sleep(ms / opt.speed);
            if (api.failOn && api.failOn.vm === o.tag && api.failOn.step === step) {
              api.failOn = null; const r = err(403, "permission", "Access denied (simulated tenant error)", step); r.ms = ms; return r;
            }
            const r = handle(method, p, o.body, o.params); r.ms = ms; return r;
          }
        };
        return api;
      }
      return { create, GIB };
    })();
    if (typeof module !== "undefined") module.exports = SimCloud;
  deploy.js: |
    // Pomocné funkce pro nasazení: převod řádků topologie na jednotlivé VM a kontrola vstupů. Čistá logika bez DOM.
    const DP = (() => {
      const GHZ_PER_CORE = 2.5;            // stejné jako v cenách: 1 jádro = 2,5 GHz = 2 500 MHz
      const MIB = 1048576;
      const MAX_VMS = 50;
      const UUID_RE = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
      const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;

      // Název VM pro CloudSigma: malá písmena, čísla, tečka, podtržítko a pomlčka
      const slug = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9._-]+/g, "-").replace(/-{2,}/g, "-").replace(/^[^a-z0-9]+/, "").replace(/[-._]+$/, "");

      // Specifikace jedné VM v jednotkách CloudSigma: jádra po 2,5 GHz, celkem MHz, RAM v bajtech (celé MiB), disk v GiB
      function specOf(r) {
        const smp = Math.max(1, Math.ceil(r.ghz / GHZ_PER_CORE - 1e-9));
        return { smp, cpu_mhz: Math.round(smp * GHZ_PER_CORE * 1000), mem_bytes: Math.max(1, Math.round(r.ram * 1024)) * MIB,
                 disk_gib: Math.max(1, Math.ceil(r.disk - 1e-9)), disk_tier: r.tier, ghz_requested: r.ghz, ghz_actual: smp * GHZ_PER_CORE };
      }

      // Rozbalí řádky topologie (počet × VM) na jednotlivé VM s jedinečnými názvy.
      // rows: [{key, name, role, count, ghz, ram, disk, tier}], prefix: předpona názvu
      function expand(rows, prefix) {
        const out = [], seen = new Set(), pre = slug(prefix || "");
        rows.forEach((r) => {
          const base = slug((pre ? pre + "-" : "") + r.name) || "vm", spec = specOf(r);
          for (let k = 1; k <= r.count; k++) {
            let name = (r.count > 1 ? base + "-" + k : base).slice(-64).replace(/^[^A-Za-z0-9]+/, ""), n = name, i = 2;
            while (seen.has(n)) n = name + "-" + (i++);
            seen.add(n);
            out.push(Object.assign({ name: n, role: r.role, row: r.key, net: r.net }, spec));
          }
        });
        return out;
      }

      // Kontrola vstupů; vrací kódy chyb a varování (text si doplňuje stránka podle jazyka)
      function validate(cfg, vms) {
        const errors = [], warnings = [];
        if (!UUID_RE.test(cfg.image || "")) errors.push({ code: "image" });
        if ((cfg.vlan || "").trim() && !UUID_RE.test(cfg.vlan.trim())) errors.push({ code: "vlan" });
        // VLAN po skupinách topologie: { název skupiny: UUID }; prázdná hodnota = skupina bez síťové karty
        Object.entries(cfg.vlans || {}).forEach(([group, id]) => { if ((id || "").trim() && !UUID_RE.test(id.trim())) errors.push({ code: "vlan", group }); });
        if ((cfg.key || "").trim() && !UUID_RE.test(cfg.key.trim())) errors.push({ code: "key", value: cfg.key });
        if (!vms.length) errors.push({ code: "none" });
        if (vms.length > MAX_VMS) errors.push({ code: "max", n: vms.length, max: MAX_VMS });
        vms.forEach((v) => { if (!NAME_RE.test(v.name)) errors.push({ code: "name", value: v.name }); });
        const rounded = {};
        vms.forEach((v) => { if (Math.abs(v.ghz_requested - v.ghz_actual) > 1e-9 && !rounded[v.row]) rounded[v.row] = v; });
        Object.values(rounded).forEach((v) => warnings.push({ code: "ghz", name: v.name, req: v.ghz_requested, act: v.ghz_actual, smp: v.smp }));
        return { errors, warnings };
      }

      return { GHZ_PER_CORE, MAX_VMS, UUID_RE, slug, specOf, expand, validate };
    })();
    if (typeof module !== "undefined") module.exports = DP;
  deployer.js: |
    // Nasazení VM přímými voláními API (bez skriptů). Postup a tvary payloadů převzaté z aplikace cloudsigma-interactive:
    //   1 create  POST servers/                          VM vzniká zastavená
    //   2 clone   POST libdrives/<image>/action/?do=clone
    //   3 wait    GET  drives/<uuid>/                    čeká na dokončení klonování (jen čtení)
    //   4 resize  PUT  drives/<uuid>/                    jen zvětšení odpojeného disku
    //   5 attach  PUT  servers/<uuid>/                   disk (virtio, 0:0, boot_order 1), VLAN své skupiny, SSH klíč
    //   6 verify  GET  servers/<uuid>/
    //   7 start   POST servers/<uuid>/action/?do=start   jen když je zvoleno
    // Zápisy se při chybě neopakují. Volání jdou přes "transport": zde simulovaný cloud (cloudsim.js).
    const Deployer = (() => {
      const STEPS = ["create", "clone", "wait", "resize", "attach", "verify", "start"];
      const GIB = 1073741824;
      // VLAN dané VM: každá skupina (větev) topologie má vlastní VLAN, proto má přednost opts.vlanOf(vm); opts.vlan je společná záloha
      const vlanFor = (vm, opts) => (opts.vlanOf ? opts.vlanOf(vm) : opts.vlan) || "";

      class ApiError extends Error {
        constructor(status, diagnostics) { super("CloudSigma HTTP " + status + (diagnostics ? ": " + diagnostics : "")); this.status = status; this.diagnostics = diagnostics; }
      }
      // jen povolená pole odpovědi s chybou (jako v aplikaci), nikdy celé tělo
      function diag(json) {
        const allowed = ["error_type", "error_point", "error_message", "error", "message", "detail", "code"];
        const rows = Array.isArray(json) ? json.slice(0, 5) : json && typeof json === "object" ? [json] : [];
        return rows.map((r) => allowed.filter((k) => r && r[k] != null).map((k) => k + "=" + String(r[k]).slice(0, 160)).join(", ")).filter(Boolean).join("; ");
      }
      // přímé volání API: zapíše do logu (metoda, cesta, stav, doba) a při chybě vyhodí ApiError
      function makeApi(transport, onLog) {
        return {
          async call(method, path, body, params, tag) {
            const r = await transport.request(method, path, { body, params, tag });
            if (onLog) onLog({ t: new Date(), tag: tag || "", method, path: path + (params && params.do ? "?do=" + params.do : ""), status: r.status, ms: r.ms, ok: r.ok });
            if (!r.ok) throw new ApiError(r.status, diag(r.json));
            return r.json;
          }
        };
      }
      const firstUuid = (json, what) => { const u = json && json.objects && json.objects[0] && json.objects[0].uuid; if (!u) throw new Error("API nevrátilo UUID: " + what); return u; };
      const vncPassword = () => { const b = new Uint8Array(24); (typeof crypto !== "undefined" && crypto.getRandomValues ? crypto : require("crypto").webcrypto).getRandomValues(b); return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join(""); };

      // Nasadí jednu VM. hooks.step(krok, stav, detail, uuid); stavy: running | ok | skipped | failed
      async function deployVm(api, vm, opts, hooks) {
        const tag = vm.name, step = (s, st, detail, uuid) => hooks && hooks.step && hooks.step(s, st, detail, uuid), created = {};
        let current = "create";
        try {
          step("create", "running"); current = "create";
          const spec = { name: vm.name, cpu: vm.cpu_mhz, mem: vm.mem_bytes, smp: vm.smp, vnc_password: vncPassword() };
          const sv = await api.call("POST", "servers/", { objects: [spec] }, null, tag); created.vm = firstUuid(sv, "VM");
          step("create", "ok", null, created.vm);

          step("clone", "running"); current = "clone";
          const cl = await api.call("POST", "libdrives/" + opts.image + "/action/", { name: vm.name + "-root" }, { do: "clone" }, tag); created.disk = firstUuid(cl, "disk");
          step("clone", "ok", null, created.disk);

          step("wait", "running"); current = "wait"; let drive, polls = 0;
          for (;;) {
            drive = await api.call("GET", "drives/" + created.disk + "/", null, null, tag); polls++;
            if (drive.status === "unmounted" && !(drive.mounted_on || []).length) break;
            if (polls >= (opts.maxPolls || 60)) throw new Error("Klonování disku neskončilo v limitu (" + polls + " kontrol)");
            step("wait", "running", "stav disku: " + drive.status + ", kontrola " + polls);
            await opts.sleep(opts.pollMs || 1000);
          }
          step("wait", "ok", polls + " kontrol");

          current = "resize"; const want = vm.disk_gib * GIB;
          if (want > drive.size) {
            step("resize", "running");
            await api.call("PUT", "drives/" + created.disk + "/", { name: drive.name, size: want, media: drive.media, storage_type: drive.storage_type }, null, tag);
            const chk = await api.call("GET", "drives/" + created.disk + "/", null, null, tag);
            if (chk.size !== want) throw new Error("Velikost disku se po zápisu neověřila");
            step("resize", "ok", "na " + vm.disk_gib + " GiB");
          } else step("resize", "skipped", "image má " + (drive.size / GIB).toFixed(1) + " GiB, disk se nezmenšuje");

          step("attach", "running"); current = "attach";
          const vlan = vlanFor(vm, opts);
          const fresh = await api.call("GET", "servers/" + created.vm + "/", null, null, tag);
          if (fresh.status !== "stopped") throw new Error("VM není zastavená");
          const body = { name: fresh.name, cpu: fresh.cpu, mem: fresh.mem, smp: fresh.smp, vnc_password: fresh.vnc_password,
            drives: [{ drive: created.disk, device: "virtio", dev_channel: "0:0", boot_order: 1 }], nics: vlan ? [{ model: "virtio", vlan }] : [] };
          if (opts.key) body.pubkeys = [opts.key];                 // ověřený formát tenantu: seznam holých UUID
          await api.call("PUT", "servers/" + created.vm + "/", body, null, tag);
          step("attach", "ok", (vlan ? "síť nastavena" : "bez NIC") + (opts.key ? ", SSH klíč přiřazen" : ""));

          step("verify", "running"); current = "verify";
          const ver = await api.call("GET", "servers/" + created.vm + "/", null, null, tag);
          if (!(ver.drives || []).some((d) => d.drive === created.disk)) throw new Error("Disk není u VM připojený");
          step("verify", "ok");

          if (opts.start) { step("start", "running"); current = "start"; await api.call("POST", "servers/" + created.vm + "/action/", {}, { do: "start" }, tag); step("start", "ok", "požadavek přijat"); }
          else step("start", "skipped", "bez spuštění");
          return created;
        } catch (e) { step(current, "failed", e.message); e.created = created; throw e; }
      }

      // Spustí nasazení více VM s omezeným počtem souběžně. Vrací { halt(), done }: při první chybě nebo po halt()
      // se další VM už nezačínají (rozpracované doběhnou). Nic se nemaže a zápisy se neopakují.
      function start(api, vms, opts, hooks) {
        const limit = Math.max(1, opts.concurrency || 1), ctl = { halted: false, byUser: false }, out = { ok: [], failed: [], notStarted: [], peak: 0 }, h = hooks || {};
        let next = 0, running = 0;
        async function worker() {
          while (!ctl.halted && next < vms.length) {
            const vm = vms[next++]; running++; out.peak = Math.max(out.peak, running);
            h.vm && h.vm(vm.name, "deploying");
            try { await deployVm(api, vm, opts, { step: (s, st, d, u) => h.step && h.step(vm.name, s, st, d, u) }); out.ok.push(vm.name); h.vm && h.vm(vm.name, "deployed"); }
            catch (e) { out.failed.push({ name: vm.name, message: e.message }); ctl.halted = true; h.vm && h.vm(vm.name, "failed", e.message); }
            finally { running--; }
          }
        }
        h.run && h.run("running");
        const done = Promise.all(Array.from({ length: Math.min(limit, vms.length) }, worker)).then(() => {
          out.notStarted = vms.slice(next).map((v) => v.name);
          out.status = out.failed.length ? "failed" : ctl.byUser ? "stopped" : "ok";
          h.run && h.run(out.status, out); return out;
        });
        return { halt: () => { ctl.halted = true; ctl.byUser = true; }, done };
      }

      // --- příprava režimu Exekuce (zatím vypnuto) ---
      // Exekuce má používat stejné deployVm/start, jen s jiným "transportem": MCP server s nástroji pro Business Cloud API místo SimCloud.
      // Dokud je LIVE_ENABLED false, žádné skutečné volání se neodešle; plan() jen vypíše, co by se volalo (dry-run).
      // Nástroje MCP serveru (adresáře clients a tools): čtení cs_api_list/cs_api_get, iaas_list_library_drives a zápis jen
      // iaas_server_action (start/stop/restart s potvrzením "akce:uuid"). Nástroje pro vytvoření VM, klon, zvětšení a připojení disku neexistují.
      const LIVE_ENABLED = false;
      function mcpMap(method, path, params, body) {
        const q = (params && params.do) || ((path.match(/\?do=(\w+)$/) || [])[1]), p = path.replace(/\?.*$/, "");
        let m;
        if (method === "GET" && p === "libdrives/") return { tool: "iaas_list_library_drives", arguments: {} };
        if (method === "GET" && (m = p.match(/^(drives|servers)\/([^/]+)\/$/))) return { tool: "cs_api_get", arguments: { resource: m[1], uuid: m[2] } };
        if (method === "POST" && q === "start" && (m = p.match(/^servers\/([^/]+)\/action\/$/))) return { tool: "iaas_server_action", arguments: { uuid: m[1], action: "start", confirmation: "start:" + m[1] } };
        return null;                       // zápis (create, clone, resize, attach) v MCP serveru zatím není
      }
