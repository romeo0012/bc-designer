    <!doctype html>
    <html lang="cs">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Business Cloud Solution Designer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 315 385'%3E%3Cpath fill='%23e20074' d='M0 0H315V130H289C289 60 245 25 210 25V345C210 362 230 364 250 372V385H63V372C90 364 122 362 122 345V25C70 25 26 60 26 130H0ZM0 175H77V252H0ZM238 175H315V252H238Z'/%3E%3C/svg%3E">
    <style>
      :root {
        --bg: #f4f6fa; --panel: #ffffff; --border: #d5dbe6; --text: #1b2433; --muted: #5d6a80;
        --accent: #e20074; --accent-soft: #fde8f2; --accent-text: #ffffff;
        --vm-bg: #f3f9ff; --vm-border: #3b8ad9;
        --info-bg: #eaf1fb; --input-bg: #ffffff; --input-border: #b8c2d4; --danger: #c0392b; --ok: #2e7d32; --warn: #b9650a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1520; --panel: #182131; --border: #2b3850; --text: #e6ebf5; --muted: #98a6c0;
          --accent: #e20074; --accent-soft: #3a1a2e; --accent-text: #ffffff;
          --vm-bg: #12202f; --vm-border: #3b7fc4;
          --info-bg: #14253b; --input-bg: #0f1722; --input-border: #3a4a66; --danger: #ff7b6b; --ok: #6cc070; --warn: #f0a050;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
      .brand { color-scheme: light; background: #fff; border-bottom: 1px solid #f2d3e3;
        --panel: #ffffff; --text: #1b2433; --border: #d5dbe6; --muted: #5d6a80; --accent: #e20074; --accent-text: #ffffff; --input-bg: #fff; --input-border: #b8c2d4; }
      .brand-ctl { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px 24px 0; }
      .brand-img { display: block; width: 100%; height: auto; max-height: 190px; object-fit: cover; object-position: center; }
      .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 12px 24px 0; }
      .cur { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }
      .cur button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
      .cur button.on { background: var(--accent); color: var(--accent-text); }
      .lang-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text); cursor: pointer; }
      .lang-btn:hover { border-color: var(--accent); }
      .lang-btn svg { display: block; height: 16px; width: auto; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
      .wrap { max-width: 1480px; margin: 0 auto; padding: 12px 24px 24px; }
      .head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
      h2 { margin: 0 0 4px; font-size: 20px; }
      h3 { margin: 0 0 8px; font-size: 16px; }
      .sub { color: var(--muted); margin: 0; max-width: 520px; }
      .toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
      .toggle button { border: 0; background: transparent; color: var(--text); padding: 7px 18px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
      .toggle button.on { background: var(--accent); color: var(--accent-text); }
      .tile.hint-tile { background: var(--info-bg); cursor: default; }
      .hint-logo { font-size: 44px !important; border: 0; background: none; cursor: pointer; padding: 0; margin-bottom: 6px !important; }
      .tile.hint-tile button#cmpbtn { margin-top: 6px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
      .hint { background: var(--info-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; max-width: 320px; }
      .hint b { display: block; }
      .hint button { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
      @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
      .tile { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 10px; cursor: pointer; font: inherit; color: var(--text); position: relative; }
      .tile:hover { border-color: var(--accent); }
      .tile[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); padding: 15px 9px; }
      .tile .ic { font-size: 28px; line-height: 1; display: block; margin-bottom: 8px; }
      .tile b { display: block; font-size: 15px; }
      .tile span.d { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
      .tile .i { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font-size: 11px; line-height: 16px; text-align: center; font-weight: 700; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
      .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
      .stat { flex: 1 1 140px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
      .stat small { display: block; color: var(--muted); }
      .stat b { font-size: 20px; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
      ul.parts { margin: 8px 0 0; padding-left: 20px; }
      ul.parts li { margin: 3px 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
      td input, td select { width: 100%; min-width: 60px; padding: 4px 6px; border: 1px solid var(--input-border); border-radius: 4px; background: var(--input-bg); color: var(--text); font: inherit; }
      td.num input { max-width: 66px; }
      #detail table tbody td:nth-child(1) { min-width: 118px; }
      #detail table tbody td:nth-child(2) { min-width: 250px; }
      #detail table tbody td:nth-child(3) { min-width: 84px; }
      #detail table tbody td:nth-child(8) { min-width: 104px; }
      #detail table th, #detail table td { padding: 6px 5px; }
      tfoot td { font-weight: 700; border-bottom: 0; }
      .tablewrap { overflow-x: auto; }
      button.btn { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text); cursor: pointer; }
      button.btn:hover { border-color: var(--accent); }
      button.btn.danger { color: var(--danger); }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .muted { color: var(--muted); }
      .note { font-size: 12px; color: var(--muted); }
      .ha-yes { color: var(--ok); font-weight: 600; }
      .ha-no { color: var(--warn); font-weight: 600; }
      .cmp tr.sel td { background: var(--accent-soft); }
      .cmp tr { cursor: pointer; }
      body { padding-bottom: 72px; }
      button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
      .req { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; max-width: calc(100vw - 32px); }
      .req-fab { font: inherit; font-weight: 700; padding: 11px 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
      .req-panel { width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 100px); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
      .req-panel[hidden] { display: none; }
      .req-head { display: flex; align-items: center; gap: 8px; }
      .req-head b { flex: 1; font-size: 15px; }
      .req-head button { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
      .req-panel textarea { width: 100%; min-height: 96px; resize: vertical; margin: 8px 0; padding: 8px 10px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text); font: inherit; }
      .req-ex { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
      .req-ex button { text-align: left; font: inherit; font-size: 12px; padding: 4px 8px; border: 1px dashed var(--border); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
      .req-ex button:hover { border-color: var(--accent); color: var(--text); }
      .req-out { margin-top: 12px; font-size: 13px; }
      .req-out ul { margin: 4px 0 8px; padding-left: 18px; }
      .req-msg { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); }
      .req-panel details { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .req-panel summary { cursor: pointer; }
      .req-brief { margin: 8px 0 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--info-bg); }
      .req-applied { margin: 6px 0 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 12px; }
      tr.grp td { background: var(--bg); font-weight: 700; padding-top: 12px; border-bottom: 1px solid var(--border); }
      tr.grp.hl td { background: var(--accent-soft); color: var(--accent); border-bottom-color: var(--accent); }
      tr.grp small { font-weight: 400; color: var(--muted); margin-left: 10px; }
      tr.hl-row td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
      tr.hl-row td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
      tr.shared-row input:disabled, tr.shared-row select:disabled { opacity: .75; cursor: not-allowed; }
      .deploy { margin-top: 14px; }
      .dp-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 18px; margin: 4px 0 8px; align-items: start; }
      .dp-form label { display: flex; flex-direction: column; gap: 3px; font-weight: 600; font-size: 13px; }
      .dp-form input[type=text], .dp-form input:not([type]), .dp-form textarea { padding: 6px 9px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text); font: inherit; font-weight: 400; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .dp-check { flex-direction: row !important; align-items: center; gap: 6px; font-weight: 600; }
      .dp-sum { margin: 12px 0 6px; font-weight: 600; }
      .dp-err { margin: 4px 0; padding: 6px 10px; border-left: 3px solid var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); border-radius: 0 6px 6px 0; }
      .dp-warn { margin: 4px 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 0 6px 6px 0; font-size: 13px; }
      .dp-ok { margin: 8px 0 4px; padding: 6px 10px; border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-radius: 0 6px 6px 0; }
      .dp-go { margin-top: 12px; padding: 10px 18px; font-size: 15px; }
      .dp-go:disabled { opacity: .5; cursor: not-allowed; }
      aside[hidden] { display: none !important; }
      .dp-imgfield { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
      .dp-lbl { font-weight: 600; }
      .dp-imgshow { padding: 6px 9px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
      .dp-imgbtn { align-self: flex-start; }
      .dp-pick { margin: 4px 0 10px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--info-bg); }
      .dp-pick[hidden] { display: none; }
      .dp-search { width: 100%; padding: 6px 9px; margin: 4px 0 8px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text); font: inherit; }
      .dp-imglist { max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
      .dp-imgitem { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
      .dp-imgitem:hover { border-color: var(--accent); }
      .dp-imgitem.on { border-color: var(--accent); background: var(--accent-soft); }
      .dp-imgitem small { color: var(--muted); white-space: nowrap; }
      .dp-row { padding: 3px 12px; }
      .dp-row:disabled { opacity: .45; cursor: not-allowed; }
      .trk-chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--border); color: var(--text); }
      .trk-chip[data-s="running"], #trk-fab[data-s="running"] { background: var(--accent); color: var(--accent-text); }
      .trk-chip[data-s="ok"] { background: var(--ok); color: #fff; }
      .trk-chip[data-s="failed"], .trk-chip[data-s="cancelled"], .trk-chip[data-s="stopped"] { background: var(--danger); color: #fff; }
      .trk-bar { height: 8px; margin: 10px 0 0; background: var(--border); border-radius: 999px; overflow: hidden; }
      .trk-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
      .trk-steps { grid-column: 1 / -1; display: flex; gap: 4px; }
      .trk-dot { flex: 1; height: 8px; border-radius: 999px; background: var(--border); }
      .trk-dot.s-ok { background: var(--ok); }
      .trk-dot.s-failed { background: var(--danger); }
      .trk-dot.s-running { background: var(--accent); animation: trkpulse 1s ease-in-out infinite; }
      .trk-dot.s-skipped { background: transparent; border: 1px dashed var(--muted); }
      @keyframes trkpulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .trk-dot.s-running { animation: none; } }
      .bgrp { margin-top: 10px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; }
      .bgrp.hl { background: var(--accent-soft); border-color: var(--accent); }
      .bgrp-h { font-weight: 700; }
      .bgrp.hl .bgrp-h { color: var(--accent); }
