    <body>
    <header class="brand">
      <div class="brand-ctl"><div class="cur" id="cur" role="group" data-ia="aria-label" aria-label="Měna"><button type="button" data-cur="CZK">CZK</button><button type="button" data-cur="EUR">EUR</button><button type="button" data-cur="USD">USD</button></div>
      <button id="lang" class="lang-btn" type="button"></button></div>
      <img id="brand-img" class="brand-img" alt="Business Cloud Solution Designer">
    </header>
    <script>document.getElementById("brand-img").src = location.pathname.replace(/\/[^\/]*\.html$/, "").replace(/\/$/, "") + "/brand.jpg";</script>
    <div class="wrap">
      <div class="head">
        <div>
          <h2><span data-i>1. Vyberte use case</span> <span class="muted" data-ia="title" title="Každý scénář obsahuje doporučené výchozí nastavení.">&#9432;</span></h2>
          <p class="sub" data-i>Zvolte typ aplikace, který nejlépe odpovídá vašemu záměru. Každý scénář obsahuje doporučené výchozí nastavení.</p>
        </div>
        <div class="toggle" role="group" data-ia="aria-label" aria-label="Režim zobrazení">
          <button id="m-biz" type="button" data-i>Business pohled</button>
          <button id="m-arch" type="button" data-i>Architekt mód</button>
          <button id="m-deploy" type="button" data-i>Deploy VM</button>
          <button id="m-k8s" type="button" data-i>Deploy Kubernetes</button>
          <button id="m-heal" type="button" data-i>Provozní asistent</button>
          <button id="m-docs" type="button" data-i>Dokumentace</button>
        </div>
      </div>

      <div class="grid" id="tiles"></div>

      <div class="panel" id="cmp" hidden>
        <h3 data-i>Porovnání scénářů</h3>
        <div class="tablewrap"><table class="cmp"><thead><tr><th data-i>Use case</th><th data-i>VM</th><th data-i>CPU (GHz)</th><th data-i>RAM (GiB)</th><th data-i>Disk</th><th data-i>Dostupnost</th><th data-i>Velikost</th></tr></thead><tbody id="cmpbody"></tbody></table></div>
        <p class="note" data-i>Klikněte na řádek pro výběr scénáře.</p>
      </div>

      <div class="panel" id="detail"></div>
      <p class="note" data-i>Doporučené výchozí nastavení je orientační návrh podle obecných zásad (CPU v GHz = vCPU &times; 2,5 GHz). Skutečné dimenzování závisí na zátěži a mělo by se ověřit měřením.</p>
    </div>

    <aside class="req" aria-label="Business požadavky" data-ia="aria-label">
      <div class="req-panel" id="req-panel" hidden>
        <div class="req-head"><b data-i>Business požadavky</b><button id="req-close" type="button" aria-label="Zavřít" data-ia="aria-label">&times;</button></div>
        <p class="note" style="margin:4px 0 0"><span data-i>Scénář:</span> <b id="req-uc"></b>. <span data-i>V poli je předpokládané zadání, kterému odpovídají výchozí hodnoty. Upravte ho vlastními slovy a sizing se přepočítá.</span></p>
        <textarea id="req-text" data-ia="placeholder" placeholder="Např. 10 000 uživatelů, dostupnost 99,9 %, 2 TB dat, růst 30 % ročně, sezónní špičky"></textarea>
        <div class="req-ex" id="req-ex"></div>
        <div class="actions" style="margin-top:0">
          <button id="req-go" type="button" class="btn primary" data-i>Přepočítat sizing</button>
          <button id="req-clear" type="button" class="btn" data-i>Zrušit zadání</button>
        </div>
        <div class="req-out" id="req-out" aria-live="polite"></div>
        <details>
          <summary data-i>Jak se počítá</summary>
          <p data-i>Je to pravidlový výpočet, ne AI. Rozpoznává počet uživatelů (celkem i souběžně), požadavky za sekundu, objem dat, dostupnost (např. 99,9 %), růst, špičky a neprodukční prostředí. Výchozí sizing odpovídá předpokládanému zadání scénáře (je předvyplněné v poli); vaše zadání se s ním porovná a zátěž se přepočítá sublineárně (exponent 0,75), s horizontem 2 roky. Aplikační vrstva se škáluje počtem instancí, databáze velikostí VM a diskem, provozní služby jen disky. Řídicí komponenty (např. etcd) s uživateli neroste. Jedna VM má strop 64 vCPU a 512 GiB, nad ním se přidávají uzly. Přepočet vychází vždy z výchozích hodnot a přepíše ruční úpravy tohoto scénáře.</p>
        </details>
      </div>
      <button id="req-fab" class="req-fab" type="button" aria-expanded="false" aria-controls="req-panel">&#128172; <span data-i>Business požadavky</span></button>
    </aside>
    <aside class="req ops" id="ops" hidden aria-label="Provozní požadavky" data-ia="aria-label">
      <div class="req-panel" id="ops-panel" hidden>
        <div class="req-head"><b data-i>Provozní požadavky</b><button id="ops-close" type="button" aria-label="Zavřít" data-ia="aria-label">&times;</button></div>
        <div class="ops-msgs" id="ops-msgs" aria-live="polite"></div>
        <div class="req-ex" id="ops-ex"></div>
        <form id="ops-form" class="ops-form"><input id="ops-in" type="text" autocomplete="off" data-ia="placeholder" placeholder="Např. Oprav aplikaci web"><button class="btn primary" type="submit" data-i>Odeslat</button></form>
      </div>
      <button id="ops-fab" class="req-fab" type="button" aria-expanded="false" aria-controls="ops-panel">&#128172; <span data-i>Provozní požadavky</span></button>
    </aside>
    <aside id="dpbar" hidden aria-label="Průběh nasazení" data-ia="aria-label">
      <div class="dpb-head">
        <b id="dpb-title">Průběh nasazení (simulace)</b><span class="trk-chip" id="dpb-state"></span>
        <div class="trk-bar dpb-bar"><i id="dpb-fill"></i></div>
        <span class="dpb-sum" id="dpb-sum"></span>
        <div class="dpb-speed" id="dpb-speed" role="group" aria-label="Rychlost simulace" data-ia="aria-label,title" title="1× = simulované doby odpovědí API odpovídají skutečným; vyšší číslo je rychlejší, nižší zpomalí (vhodné pro předvádění). Změna platí okamžitě i během nasazování."><span data-i>Rychlost simulace</span></div>
        <button id="dpb-toggle" type="button" class="btn" aria-expanded="true" data-i>Sbalit</button>
      </div>
      <div class="dpb-log" id="dpb-log" role="log" aria-live="polite" aria-label="Volání API" data-ia="aria-label"></div>
    </aside>
    <script>
    // základní cesta se odvodí z URL (funguje pod /bc-designer i na /)
    (function () { var b = location.pathname.replace(/\/[^\/]*\.html$/, "").replace(/\/$/, "") + "/";
      document.write('<script src="' + b + 'i18n.js"><\/script><script src="' + b + 'usecases.js"><\/script><script src="' + b + 'sizing.js"><\/script><script src="' + b + 'pricing.js"><\/script><script src="' + b + 'deploy.js"><\/script><script src="' + b + 'cloudsim.js"><\/script><script src="' + b + 'deployer.js"><\/script><script src="' + b + 'k8sinstall.js"><\/script><script src="' + b + 'selfheal.js"><\/script>'); })();
    </script>
    <script>
    const GHZ = 2.5;
    const TIERS = ["Basic", "Standard", "Fast", "Super Fast"];
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n.toLocaleString(LANG === "en" ? "en-GB" : "cs-CZ", { maximumFractionDigits: 1 });
    const fmtGb = (gb) => gb >= 1000 ? fmt(gb / 1000) + " TB" : fmt(gb) + " GB";
    const num = (v, d) => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : d; };

    let state = { id: UC.find(u => u.id !== "k8s").id, mode: "biz" };
    let rows = {}; // id -> pole komponent (upravitelné)

    // Sdílené skupiny: Bezpečnost, Provozní a Vývojové se ve všech scénářích přebírají z Kubernetes Clusteru (jen ke čtení).
    const SHARED_SRC = "k8s";
    const SHARED_CATS = ["Bezpečnost", "Provozní", "Vývojové"];
    const SHARED_NAMES = new Set(["firewall", "nfs-storage", "prometheus", "grafana", "elk-kibana", "backup", "keycloak", "vault", "gitlab", "argo-cd", "sonar", "nexus", "etcd"]);
    const isSharedCat = (role) => SHARED_CATS.includes(catOf(role));
    // starší kopie sdílených řádků (uložené nebo ve výchozích datech) se zahazují, nahrazuje je živý odkaz na Kubernetes Cluster
    const isLegacyCopy = (r) => SHARED_NAMES.has(r.name) && isSharedCat(r.role);
    function factory(u) {
      const list = u.parts.map(p => ({ name: p[0], role: p[1], count: p[2], ghz: p[3] * GHZ, ram: p[4], disk: p[5], tier: p[6], note: p[7] || "", fn: p[8] || "" }));
      return u.id === SHARED_SRC ? list : list.filter(r => !isLegacyCopy(r));
    }
    function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    // nastavení cen (společné pro všechny scénáře): délka závazku, utilizace a rezervace v %
    // měna: ceník je v Kč, ostatní měny jsou přepočet kurzem ČNB (viz pricing.js)
    let currency = PR.CURRENCIES.includes(lsGet("usecase-currency")) ? lsGet("usecase-currency") : "CZK";
    const curName = () => currency === "CZK" ? (LANG === "en" ? "CZK" : "Kč") : currency;
    const locale = () => LANG === "en" ? "en-GB" : "cs-CZ";
    const dateFmt = (iso) => iso ? new Date(iso).toLocaleString(locale(), { dateStyle: "short", timeStyle: "short" }) : "-";
    // částka zadaná v Kč, zobrazená ve zvolené měně (Kč na celé koruny, EUR a USD na 2 desetinná místa)
    function fmtKc(czk, d) {
      const dec = d !== undefined ? d : (currency === "CZK" ? 0 : 2);
      return (czk / PR.FX[currency]).toLocaleString(locale(), { minimumFractionDigits: currency === "CZK" ? 0 : dec, maximumFractionDigits: dec }) + " " + curName();
    }
    const fxNote = () => T("Částky jsou přepočtené z Kč. Kurz {src} k {date}: 1 EUR = {eur} Kč, 1 USD = {usd} Kč.", {
      src: LANG === "en" ? "Czech National Bank" : "ČNB",
      date: new Date(PR.FX.date).toLocaleDateString(locale(), { day: "numeric", month: LANG === "en" ? "short" : "numeric", year: "numeric", timeZone: "UTC" }),
      eur: PR.FX.EUR.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 3 }),
      usd: PR.FX.USD.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 3 })
    });
    function renderCur() {
      document.querySelectorAll("#cur button").forEach(b => { const on = b.dataset.cur === currency; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
      $("cur").title = fxNote();
    }
    let price = (() => {
      const s = lsGet("usecase-price") || {}, d = PR.DEFAULTS, within = (v, lo, hi, def) => (Number.isFinite(v) && v >= lo && v <= hi ? Math.round(v) : def);
      return { commit: PR.COMMITS.includes(s.commit) ? s.commit : d.commit, util: within(s.util, 10, 100, d.util), res: within(s.res, 10, 100, d.res) };
    })();
    function rowsOf(id) {
      if (!rows[id]) {
        const s = lsGet("usecase-v1-" + id), base = factory(UC.find(u => u.id === id));
        if (Array.isArray(s)) {
          // starší uložené řádky nemají popis funkce, doplní se z výchozích dat (stejný název a role)
          s.forEach(r => { if (id === SHARED_SRC && r.name === "etcd" && r.role === "Aplikační") r.role = "Bezpečnost"; });
          s.forEach(r => { if (r.fn === undefined) { const b = base.find(x => x.name === r.name && x.role === r.role); r.fn = b ? b.fn : ""; } });
          rows[id] = id === SHARED_SRC ? s : s.filter(r => !isLegacyCopy(r));
        } else rows[id] = base;
      }
      return rows[id];
    }
    // Sdílené řádky (jen kopie ke čtení) z aktuálního stavu Kubernetes Clusteru
    function sharedRows(id) {
      if (id === SHARED_SRC) return [];
      return rowsOf(SHARED_SRC).filter(r => isSharedCat(r.role)).map(r => Object.assign({}, r, { shared: true }));
    }
    // Všechny řádky scénáře: vlastní (upravitelné) + sdílené z Kubernetes Clusteru
    const viewOf = (id) => rowsOf(id).concat(sharedRows(id));
    function sum(list) {
      const t = { vm: 0, ghz: 0, ram: 0, disk: 0, ha: list.length > 0 };
      list.forEach(r => { t.vm += r.count; t.ghz += r.count * r.ghz; t.ram += r.count * r.ram; t.disk += r.count * r.disk; });
      t.ha = list.some(r => r.count >= 2);
      t.vcpu = t.ghz / GHZ;
      t.size = t.vcpu < 25 ? "S" : t.vcpu < 100 ? "M" : "L";
      return t;
    }
    const SIZE = { S: "Malá (S)", M: "Střední (M)", L: "Velká (L)" };

    // --- jazyk: statické texty se překládají podle atributů data-i (text) a data-ia (atributy) ---
    const FLAG = {
      en: '<svg viewBox="0 0 60 30" width="32" height="16" aria-hidden="true"><clipPath id="fl-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="fl-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#fl-s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#fl-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>',
      cs: '<svg viewBox="0 0 3 2" width="24" height="16" aria-hidden="true"><rect width="3" height="1" fill="#fff"/><rect y="1" width="3" height="1" fill="#d7141a"/><path d="M0,0 L1.5,1 L0,2 z" fill="#11457e"/></svg>'
    };
    function applyStatic() {
      document.documentElement.lang = LANG;
      document.title = "Business Cloud Solution Designer";
      document.querySelectorAll("[data-i]").forEach(el => { if (el.dataset.k === undefined) el.dataset.k = el.textContent.trim(); el.textContent = T(el.dataset.k); });
      document.querySelectorAll("[data-ia]").forEach(el => el.dataset.ia.split(",").forEach(a => {
        const dk = "k_" + a.replace("-", "_"); if (el.dataset[dk] === undefined) el.dataset[dk] = el.getAttribute(a) || "";
        el.setAttribute(a, T(el.dataset[dk]));
      }));
      // tlačítko ukazuje jazyk, na který lze přepnout
      const to = LANG === "cs" ? "en" : "cs";
      $("lang").innerHTML = FLAG[to] + "<span>" + (to === "en" ? "EN" : "CZ") + "</span>";
      $("lang").title = to === "en" ? "English" : "Čeština";
      $("lang").setAttribute("aria-label", to === "en" ? "Switch to English" : "Přepnout do češtiny");
      if ($("cmpbtn")) $("cmpbtn").textContent = $("cmp").hidden ? T("Porovnat scénáře") : T("Skrýt porovnání");
      renderCur(); if (typeof dpbTitle === "function") dpbTitle();
    }
    document.querySelectorAll("#cur button").forEach(b => b.addEventListener("click", () => {
      currency = b.dataset.cur; lsSet("usecase-currency", currency); renderCur(); renderAll();
    }));
    function setLang(l) {
      LANG = l; try { localStorage.setItem("usecase-lang", l); } catch (e) {}
      if (typeof SZ !== "undefined") SZ.setLang(l);
      applyStatic(); renderExamples(); renderAll();
    }

    function renderTiles() {
      const g = $("tiles"); g.innerHTML = "";
      // první dlaždice: nápověda s logem Kubernetes (scénář Kubernetes Cluster není v nabídce; logo ho otevře kvůli úpravě sdílených skupin)
      const hint = document.createElement("div"); hint.className = "tile hint-tile";
      hint.innerHTML = `<button type="button" class="ic hint-logo"></button><b></b><span class="d"></span><button id="cmpbtn" type="button"></button>`;
      const k8s = UC.find(u => u.id === SHARED_SRC), lg = hint.querySelector(".hint-logo");
      lg.textContent = k8s.icon; lg.title = T(k8s.name); lg.setAttribute("aria-label", T(k8s.name));
      lg.addEventListener("click", () => { state.id = SHARED_SRC; lsSet("usecase-state", state); renderAll(); });
      hint.querySelector("b").textContent = T("★ Nevíte, který use case zvolit?"); hint.querySelector(".d").textContent = T("Porovnejte scénáře nebo se poraďte s architektem.");
      const cb = hint.querySelector("#cmpbtn"); cb.textContent = $("cmp").hidden ? T("Porovnat scénáře") : T("Skrýt porovnání");
      cb.addEventListener("click", () => { const c = $("cmp"); c.hidden = !c.hidden; cb.textContent = c.hidden ? T("Porovnat scénáře") : T("Skrýt porovnání"); });
      g.appendChild(hint);
      UC.filter(u => u.id !== SHARED_SRC).forEach(u => {
        const b = document.createElement("button"); b.type = "button"; b.className = "tile";
        b.setAttribute("aria-pressed", String(u.id === state.id));
        b.innerHTML = `<span class="i" aria-hidden="true">i</span><span class="ic" aria-hidden="true">${u.icon}</span><b></b><span class="d"></span>`;
        b.querySelector("b").textContent = T(u.name); b.querySelector(".d").textContent = T(u.desc); b.title = T(u.about);
        b.addEventListener("click", () => { state.id = u.id; lsSet("usecase-state", state); renderAll(); });
        g.appendChild(b);
      });
    }

    function renderCompare() {
      const body = $("cmpbody"); body.innerHTML = "";
      UC.filter(u => u.id !== SHARED_SRC).forEach(u => {
        const t = sum(viewOf(u.id)); const tr = document.createElement("tr"); if (u.id === state.id) tr.className = "sel";
        tr.innerHTML = `<td></td><td>${t.vm}</td><td>${fmt(t.ghz)}</td><td>${fmt(t.ram)}</td><td>${fmtGb(t.disk)}</td><td class="${t.ha ? "ha-yes" : "ha-no"}">${t.ha ? "HA" : T("bez HA")}</td><td>${t.size}</td>`;
        tr.firstChild.textContent = T(u.name); if (u.brief) tr.title = T("Předpokládané zadání: ") + T(u.brief);
        tr.addEventListener("click", () => { state.id = u.id; lsSet("usecase-state", state); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        body.appendChild(tr);
      });
    }

    // Skupiny podle role (jen u use case s příznakem groupByRole), pořadí podle prvního výskytu role.
    // Kategorie = text role před závorkou ("Aplikační (Webová vrstva)" -> "Aplikační"; anglické názvy se mapují zpět); pořadí jako v Kubernetes Clusteru.
    const CAT_ORDER = ["Bezpečnost", "Aplikační", "Databázové", "Provozní", "Vývojové"];
    const catOf = (role) => { const c = String(role).split(" (")[0]; return CAT_BACK[c.toLowerCase()] || c; };
    // Síť (VLAN) každé VM: DMZ / K8S / OPS / CICD. Volí se v tabulce Architekt módu (sloupec VLAN) a podle ní se řadí topologie v záložkách Deploy.
    // Výchozí: Bezpečnost -> DMZ (kromě etcd / control-plane / master), Provozní -> OPS, Vývojové -> CICD, vše ostatní (etcd, Aplikační, Databázové) -> K8S.
    const NETS = ["DMZ", "K8S", "OPS", "CICD"], NET_TITLE = { DMZ: "Bezpečnost", K8S: "Kubernetes cluster", OPS: "Provozní", CICD: "Vývojové" };
    const netDefault = (r) => { const c = catOf(r.role); return c === "Provozní" ? "OPS" : c === "Vývojové" ? "CICD" : c === "Bezpečnost" && !K8S_CP.has(r.name) ? "DMZ" : "K8S"; };
    const netOf = (r) => NETS.includes(r.vlan) ? r.vlan : netDefault(r);
    function groupsOf(u, list) {
      if (!u.groupByRole) return [{ role: null, idx: list.map((_, i) => i) }];
      const m = new Map();
      list.forEach((r, i) => { const c = catOf(r.role); if (!m.has(c)) m.set(c, []); m.get(c).push(i); });
      const rank = (c) => { const k = CAT_ORDER.indexOf(c); return k < 0 ? CAT_ORDER.length : k; };
      return [...m].map(([role, idx], n) => ({ role, idx, n })).sort((a, b) => rank(a.role) - rank(b.role) || a.n - b.n);
    }
    const isHl = (u, role) => (u.highlightRoles || []).includes(role);

    function renderDetail() {
      const u = UC.find(x => x.id === state.id), own = rowsOf(u.id), list = viewOf(u.id), t = sum(list), el = $("detail");
      // popisek skupiny, která se přebírá z Kubernetes Clusteru
      const sharedTag = (cat) => (u.id !== SHARED_SRC && SHARED_CATS.includes(cat)) ? T("sdíleno z Kubernetes Clusteru") : "";
      el.innerHTML = "";
      const h = document.createElement("h3"); h.textContent = T("2. Doporučené nastavení: {n}", { n: T(u.name) }); el.appendChild(h);
      const p = document.createElement("p"); p.className = "muted"; p.style.margin = "0"; p.textContent = T(u.about); el.appendChild(p);
      if (u.brief) {
        const bp = document.createElement("p"); bp.className = "req-brief";
        const bl = document.createElement("b"); bl.textContent = T("Předpokládané zadání: ");
        bp.append(bl, document.createTextNode(Q(T(u.brief)) + " " + T("Výchozí hodnoty tomuto zadání odpovídají.")));
        el.appendChild(bp);
      }
      const rq = lsGet("usecase-req-" + u.id);
      const sizing = state.mode === "biz" || state.mode === "arch";   // od záložky Deploy VM dál se přehled sizingu nezobrazuje
      if (sizing && rq && rq.text) { const ap = document.createElement("p"); ap.className = "req-applied"; ap.textContent = T("Sizing přepočítán podle zadání: ") + Q(rq.text); el.appendChild(ap); }


      const stats = document.createElement("div"); stats.className = "stats";
      const mk = (l, v) => { const d = document.createElement("div"); d.className = "stat"; d.innerHTML = `<small></small><b></b>`; d.querySelector("small").textContent = l; d.querySelector("b").textContent = v; return d; };
      stats.append(mk(T("Počet VM"), fmt(t.vm)), mk("CPU", fmt(t.ghz) + " GHz"), mk("RAM", fmt(t.ram) + " GiB"), mk("Disk", fmtGb(t.disk)));
      const av = mk(T("Dostupnost"), t.ha ? T("Vysoká (HA)") : T("Bez redundance")); av.querySelector("b").className = t.ha ? "ha-yes" : "ha-no"; av.querySelector("b").style.fontSize = "16px";
      const sz = mk(T("Velikost"), T(SIZE[t.size]));
      stats.append(av, sz); if (sizing) el.appendChild(stats);

      if (state.mode === "biz") {
        const l = document.createElement("div"); l.innerHTML = "<b></b>"; l.firstChild.textContent = T("Co obsahuje balíček"); const ul = document.createElement("ul"); ul.className = "parts";
        if (u.groupByRole) {
          groupsOf(u, list).forEach(g => {
            const hl = isHl(u, g.role), s = sum(g.idx.map(i => list[i]));
            const box = document.createElement("div"); box.className = "bgrp" + (hl ? " hl" : "");
            const hd = document.createElement("div"); hd.className = "bgrp-h"; hd.textContent = T(g.role);
            const sm = document.createElement("small"); sm.textContent = `${fmt(s.vm)} VM · ${fmt(s.ghz)} GHz · ${fmt(s.ram)} GiB · ${fmtGb(s.disk)}`; hd.appendChild(sm);
            if (hl) { const b = document.createElement("span"); b.className = "badge"; b.textContent = T("Pro Business Use-Case"); hd.appendChild(b); }
            const tag = sharedTag(g.role); if (tag) { const sh = document.createElement("small"); sh.textContent = "· " + tag; hd.appendChild(sh); }
            const gl = document.createElement("ul"); gl.className = "parts";
            g.idx.forEach(i => {
              const r = list[i], k = String(r.role).indexOf(" ("), det = k >= 0 ? String(r.role).slice(k + 2, -1) : "";
              // v Business pohledu funkce komponenty; bez ní (nová VM, starší uložená data) název a popis role
              const label = r.fn ? T(r.fn) : (r.name + (det ? " – " + T(det) : ""));
              const li = document.createElement("li"); li.textContent = `${label}${r.count > 1 ? " (" + r.count + "×)" : ""}`; gl.appendChild(li);
            });
            box.append(hd, gl); l.appendChild(box);
          });
        } else {
          // role se mohou opakovat (např. více komponent s rolí Aplikační), pak se přidá název VM
          const roleCount = {}; list.forEach(r => { roleCount[r.role] = (roleCount[r.role] || 0) + 1; });
          list.forEach(r => { const li = document.createElement("li"); li.textContent = `${roleCount[r.role] > 1 ? trRole(r.role) + ": " + r.name : trRole(r.role)}${r.count > 1 ? " (" + r.count + "×)" : ""}`; ul.appendChild(li); });
          l.appendChild(ul);
        }
        el.appendChild(l);
        const n = document.createElement("p"); n.className = "note"; n.textContent = T("Technické parametry jednotlivých VM a jejich úpravu najdete v Architekt módu."); el.appendChild(n);
        return;
      }

      if (state.mode === "deploy") { renderDeploy(u, list, el); return; }
      if (state.mode === "k8s") { renderK8s(u, list, el); return; }
      if (state.mode === "heal") { renderHeal(u, list, el); return; }
      if (state.mode === "docs") { renderDocs(u, list, el); return; }

      const wrap = document.createElement("div"); wrap.className = "tablewrap";
      const tb = document.createElement("table");
      const HEAD = ["VM", "Role", "VLAN", T("Počet"), "CPU (GHz)", "RAM (GiB)", "Disk (GB)", T("Třída disku"), T("Cena CPU"), T("Cena RAM"), T("Cena disk"), T("Cena IaaS"), T("Cloudlety"), T("Cena PaaS"), ""];
      const thead = document.createElement("thead"), htr = document.createElement("tr");
      HEAD.forEach(x => { const th = document.createElement("th"); th.textContent = x; htr.appendChild(th); }); thead.appendChild(htr);
