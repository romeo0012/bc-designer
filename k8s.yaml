      "Business požadavky": "Business requirements",
      "Zavřít": "Close",
      "Scénář:": "Scenario:",
      "V poli je předpokládané zadání, kterému odpovídají výchozí hodnoty. Upravte ho vlastními slovy a sizing se přepočítá.": "The field contains the assumed brief that the default values correspond to. Edit it in your own words and the sizing is recalculated.",
      "Např. 10 000 uživatelů, dostupnost 99,9 %, 2 TB dat, růst 30 % ročně, sezónní špičky": "E.g. 10,000 users, 99.9 % availability, 2 TB of data, 30 % annual growth, seasonal peaks",
      "Přepočítat sizing": "Recalculate sizing",
      "Zrušit zadání": "Reset brief",
      "Jak se počítá": "How it is calculated",
      "Je to pravidlový výpočet, ne AI. Rozpoznává počet uživatelů (celkem i souběžně), požadavky za sekundu, objem dat, dostupnost (např. 99,9 %), růst, špičky a neprodukční prostředí. Výchozí sizing odpovídá předpokládanému zadání scénáře (je předvyplněné v poli); vaše zadání se s ním porovná a zátěž se přepočítá sublineárně (exponent 0,75), s horizontem 2 roky. Aplikační vrstva se škáluje počtem instancí, databáze velikostí VM a diskem, provozní služby jen disky. Řídicí komponenty (např. etcd) s uživateli neroste. Jedna VM má strop 64 vCPU a 512 GiB, nad ním se přidávají uzly. Přepočet vychází vždy z výchozích hodnot a přepíše ruční úpravy tohoto scénáře.":
        "This is a rule-based calculation, not AI. It recognises the number of users (total and concurrent), requests per second, data volume, availability (e.g. 99.9 %), growth, peaks and non-production environments. The default sizing corresponds to the assumed brief of the scenario (pre-filled in the field); your brief is compared with it and the load is recalculated sub-linearly (exponent 0.75) over a 2-year horizon. The application tier scales by the number of instances, databases by VM size and disk, operations services only by disks. Control components (e.g. etcd) do not grow with users. A single VM is capped at 64 vCPU and 512 GiB, above that nodes are added. The recalculation always starts from the default values and overwrites manual edits of this scenario.",
      "Intranet pro 500 zaměstnanců, běžná dostupnost, 200 GB dat": "Intranet for 500 employees, standard availability, 200 GB of data",
      "20 000 uživatelů, dostupnost 99,9 %, 2 TB dat, růst 30 % ročně, sezónní špičky 3×": "20,000 users, 99.9 % availability, 2 TB of data, 30 % annual growth, seasonal peaks 3×",
      "Pilotní provoz pro 100 uživatelů, bez vysoké dostupnosti": "Pilot run for 100 users, no high availability",
      "Rozpoznáno v zadání": "Recognised in the brief",
      "Zátěž ≈ {u} uživatelů (×{f} oproti výchozímu sizingu). VM: {vb} → {va}, CPU: {gb} → {ga} GHz, RAM: {rb} → {ra} GiB, disk: {db} → {da}.": "Load ≈ {u} users (×{f} compared with the default sizing). VMs: {vb} → {va}, CPU: {gb} → {ga} GHz, RAM: {rb} → {ra} GiB, disk: {db} → {da}.",
      "Výchozí sizing odpovídá tomuto zadání. Upravte text a přepočítejte.": "The default sizing corresponds to this brief. Edit the text and recalculate.",
      "Napište požadavky, např. počet uživatelů, dostupnost nebo objem dat.": "Write your requirements, e.g. number of users, availability or data volume.",
      "V zadání jsem nenašel nic, z čeho jde sizing spočítat. Uveďte např. počet uživatelů, požadavky za sekundu, objem dat, dostupnost, růst nebo špičky.": "I found nothing in the brief that the sizing can be calculated from. Mention e.g. the number of users, requests per second, data volume, availability, growth or peaks.",
