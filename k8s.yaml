        "Preparation of VM creation in Business Cloud IaaS via the CloudSigma API. Select the VMs, fill in the tenant details and the page prepares a deployment plan. The page itself creates nothing and knows no credentials: the VMs are created by the cloudsigma_deploy.py script together with your application (login with OTP) only after manual confirmation.",
