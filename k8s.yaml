kind: ConfigMap
metadata:
  name: bc-designer
  namespace: hackaithon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bc-designer
  namespace: hackaithon
  labels:
    app: bc-designer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bc-designer
  template:
    metadata:
      labels:
        app: bc-designer
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: bc-designer
---
apiVersion: v1
kind: Service
metadata:
  name: bc-designer
  namespace: hackaithon
  labels:
    app: bc-designer
spec:
  type: ClusterIP
  selector:
    app: bc-designer
  ports:
    - name: http
      port: 80
      targetPort: 80
